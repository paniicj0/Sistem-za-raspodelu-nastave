<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .classBox { fill: #fffdf7; stroke: #111827; stroke-width: 1.6; }
      .header { fill: #f6f1df; stroke: #111827; stroke-width: 1.2; }
      .title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .attr { font: 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .line { stroke: #111827; stroke-width: 1.6; fill: none; }
      .dash { stroke: #111827; stroke-width: 1.4; fill: none; stroke-dasharray: 7 5; }
      .mult { font: 700 14px Arial, sans-serif; fill: #111827; }
      .role { font: 13px Arial, sans-serif; fill: #374151; }
      .noteBox { fill: #fffdf7; stroke: #6b7280; stroke-width: 1.2; }
      .noteText { font: 14px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1250" />
  <text class="title" x="60" y="45">Sistem za raspodelu nastave - klasni dijagram modela</text>

  <!-- Assistant -->
  <rect class="classBox" x="70" y="140" width="310" height="260" />
  <rect class="header" x="70" y="140" width="310" height="42" />
  <text class="title" x="175" y="167">Assistant</text>
  <line class="line" x1="70" y1="182" x2="380" y2="182" />
  <text class="attr" x="90" y="212">- id: int</text>
  <text class="attr" x="90" y="237">- name: String</text>
  <text class="attr" x="90" y="262">- targetLoad: int</text>
  <text class="attr" x="90" y="287">- winterLoad: int</text>
  <text class="attr" x="90" y="312">- summerLoad: int</text>
  <text class="attr" x="90" y="337">- maxLoad: int</text>
  <text class="attr" x="90" y="362">- placeholder: boolean</text>
  <line class="line" x1="70" y1="375" x2="380" y2="375" />
  <text class="attr" x="90" y="392">+ getTotalLoad(): int</text>

  <!-- Subject -->
  <rect class="classBox" x="1420" y="140" width="310" height="280" />
  <rect class="header" x="1420" y="140" width="310" height="42" />
  <text class="title" x="1540" y="167">Subject</text>
  <line class="line" x1="1420" y1="182" x2="1730" y2="182" />
  <text class="attr" x="1440" y="212">- id: int</text>
  <text class="attr" x="1440" y="237">- code: String</text>
  <text class="attr" x="1440" y="262">- name: String</text>
  <text class="attr" x="1440" y="287">- semester: int</text>
  <text class="attr" x="1440" y="312">- groups: int</text>
  <text class="attr" x="1440" y="337">- hoursPerGroup: int</text>
  <text class="attr" x="1440" y="362">- totalHours: int</text>
  <line class="line" x1="1420" y1="375" x2="1730" y2="375" />
  <text class="attr" x="1440" y="392">+ isLargeSubject(): boolean</text>
  <text class="attr" x="1440" y="414">+ getFirstHalfHours(): int</text>

  <!-- Preference -->
  <rect class="classBox" x="720" y="105" width="360" height="130" />
  <rect class="header" x="720" y="105" width="360" height="38" />
  <text class="title" x="852" y="130">Preference</text>
  <line class="line" x1="720" y1="143" x2="1080" y2="143" />
  <text class="attr" x="740" y="172">- id: int</text>
  <text class="attr" x="740" y="197">- grade: int</text>
  <text class="small" x="740" y="220">veza: assistant + subject + ocena</text>

  <!-- PreviousAssignment -->
  <rect class="classBox" x="720" y="285" width="360" height="130" />
  <rect class="header" x="720" y="285" width="360" height="38" />
  <text class="title" x="803" y="310">PreviousAssignment</text>
  <line class="line" x1="720" y1="323" x2="1080" y2="323" />
  <text class="attr" x="740" y="352">- id: int</text>
  <text class="attr" x="740" y="377">- assignedHours: int</text>
  <text class="small" x="740" y="400">prethodna raspodela</text>

  <!-- SpecificRequest -->
  <rect class="classBox" x="720" y="465" width="360" height="150" />
  <rect class="header" x="720" y="465" width="360" height="38" />
  <text class="title" x="818" y="490">SpecificRequest</text>
  <line class="line" x1="720" y1="503" x2="1080" y2="503" />
  <text class="attr" x="740" y="532">- id: int</text>
  <text class="attr" x="740" y="557">- requestedHours: Integer</text>
  <text class="attr" x="740" y="582">- priority: int</text>
  <text class="small" x="740" y="605">zahtev profesora/asistenta</text>

  <!-- Candidate -->
  <rect class="classBox" x="720" y="665" width="360" height="190" />
  <rect class="header" x="720" y="665" width="360" height="38" />
  <text class="title" x="858" y="690">Candidate</text>
  <line class="line" x1="720" y1="703" x2="1080" y2="703" />
  <text class="attr" x="740" y="732">- id: int</text>
  <text class="attr" x="740" y="757">- score: int</text>
  <text class="attr" x="740" y="782">- explanation: String</text>
  <text class="attr" x="740" y="807">- assigned: boolean</text>
  <text class="attr" x="740" y="832">- rule flags: boolean</text>

  <!-- AssignmentResult -->
  <rect class="classBox" x="720" y="905" width="360" height="155" />
  <rect class="header" x="720" y="905" width="360" height="38" />
  <text class="title" x="822" y="930">AssignmentResult</text>
  <line class="line" x1="720" y1="943" x2="1080" y2="943" />
  <text class="attr" x="740" y="972">- id: int</text>
  <text class="attr" x="740" y="997">- assignedHours: int</text>
  <text class="attr" x="740" y="1022">- score: int</text>
  <text class="attr" x="740" y="1047">- explanation: String</text>

  <!-- Support classes -->
  <rect class="classBox" x="70" y="960" width="310" height="125" />
  <rect class="header" x="70" y="960" width="310" height="38" />
  <text class="title" x="139" y="985">ValidationMessage</text>
  <line class="line" x1="70" y1="998" x2="380" y2="998" />
  <text class="attr" x="90" y="1027">- id: int</text>
  <text class="attr" x="90" y="1052">- level: String</text>
  <text class="attr" x="90" y="1077">- message: String</text>

  <rect class="classBox" x="1420" y="960" width="310" height="145" />
  <rect class="header" x="1420" y="960" width="310" height="38" />
  <text class="title" x="1480" y="985">RequestTemplateData</text>
  <line class="line" x1="1420" y1="998" x2="1730" y2="998" />
  <text class="attr" x="1440" y="1027">- assistantName: String</text>
  <text class="attr" x="1440" y="1052">- subjectName: String</text>
  <text class="attr" x="1440" y="1077">- priority: int</text>
  <text class="attr" x="1440" y="1102">- requestedHours: int</text>

  <!-- Association lines: no direct Assistant-Subject connection -->
  <!-- Assistant to association classes -->
  <path class="line" d="M380 170 H720" />
  <text class="mult" x="395" y="160">1</text>
  <text class="mult" x="680" y="160">0..*</text>
  <text class="role" x="470" y="190">assistant</text>

  <path class="line" d="M380 350 H720" />
  <text class="mult" x="395" y="340">1</text>
  <text class="mult" x="680" y="340">0..*</text>
  <text class="role" x="470" y="370">assistant</text>

  <path class="line" d="M380 540 H720" />
  <text class="mult" x="395" y="530">1</text>
  <text class="mult" x="680" y="530">0..*</text>
  <text class="role" x="470" y="560">assistant</text>

  <path class="line" d="M380 760 H720" />
  <text class="mult" x="395" y="750">1</text>
  <text class="mult" x="680" y="750">0..*</text>
  <text class="role" x="470" y="780">assistant</text>

  <path class="line" d="M380 982 H720" />
  <text class="mult" x="395" y="972">1</text>
  <text class="mult" x="680" y="972">0..*</text>
  <text class="role" x="470" y="1002">assistant</text>

  <!-- Association classes to Subject -->
  <path class="line" d="M1080 170 H1420" />
  <text class="mult" x="1095" y="160">0..*</text>
  <text class="mult" x="1388" y="160">1</text>
  <text class="role" x="1232" y="190">subject</text>

  <path class="line" d="M1080 350 H1420" />
  <text class="mult" x="1095" y="340">0..*</text>
  <text class="mult" x="1388" y="340">1</text>
  <text class="role" x="1232" y="370">subject</text>

  <path class="line" d="M1080 540 H1420" />
  <text class="mult" x="1095" y="530">0..*</text>
  <text class="mult" x="1388" y="530">1</text>
  <text class="role" x="1232" y="560">subject</text>

  <path class="line" d="M1080 760 H1420" />
  <text class="mult" x="1095" y="750">0..*</text>
  <text class="mult" x="1388" y="750">1</text>
  <text class="role" x="1232" y="780">subject</text>

  <path class="line" d="M1080 982 H1420" />
  <text class="mult" x="1095" y="972">0..*</text>
  <text class="mult" x="1388" y="972">1</text>
  <text class="role" x="1232" y="1002">subject</text>

  <!-- Dependency from request to template data -->
  <path class="dash" d="M1080 585 C1210 650 1330 805 1480 960" />
  <text class="role" x="1160" y="710">generise podatke za template</text>

  <!-- Note -->
  <rect class="noteBox" x="575" y="1110" width="650" height="90" />
  <text class="noteText" x="600" y="1140">Napomena: Assistant i Subject nemaju direktnu vezu.</text>
  <text class="noteText" x="600" y="1165">Povezani su iskljucivo preko veznih klasa koje nose dodatne podatke.</text>
  <text class="noteText" x="600" y="1190">Zato je odnos konceptualno M:N, ali nije direktna UML asocijacija Assistant-Subject.</text>
</svg>